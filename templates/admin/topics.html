{% extends "base.html" %}
{% block title %}Manage Topics{% endblock %}
{% block content %}
<h1>Topics</h1>
<form method="POST" class="card mb-2">
    <h3>Add Topic</h3>
    <div class="form-group"><label>Name</label><input type="text" name="name" class="form-control" required></div>
    <div class="form-group"><label>Icon (emoji)</label><input type="text" name="icon" class="form-control" placeholder="🌱"></div>
    <div class="form-group"><label>Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
    <button type="submit" class="btn btn-primary">Add Topic</button>
</form>
<table class="data-table">
    <thead><tr><th>Icon</th><th>Name</th><th>Lessons</th></tr></thead>
    <tbody>
    {% for t in topics %}
        <tr><td>{{ t.icon }}</td><td>{{ t.name }}</td><td>{{ t.lesson_count }}</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
